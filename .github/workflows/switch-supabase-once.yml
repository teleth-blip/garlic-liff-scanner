name: Switch Supabase Once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/switch-supabase-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Supabase constants
        shell: bash
        env:
          OLD_URL: https://yedrlbrzrkbtgswzplia.supabase.co
          NEW_URL: https://gkazhcddknmgzglcdwtk.supabase.co
          OLD_KEY: sb_publishable_TiUI0G7_5emKLNINYjRJmA_NluL-UYb
          NEW_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdrYXpoY2Rka25tZ3pnbGNkd3RrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5NjE5NzcsImV4cCI6MjEwMzUzNzk3N30.3KjmIAKyUvZzIWW09SphpGycBP2PqkhVNvIKwlF2CI0
        run: |
          set -euo pipefail
          for file in index.html supabase/app.html; do
            test -f "$file"
            python3 - "$file" <<'PY'
import os
import pathlib
import sys
path = pathlib.Path(sys.argv[1])
text = path.read_text(encoding='utf-8')
text = text.replace(os.environ['OLD_URL'], os.environ['NEW_URL'])
text = text.replace(os.environ['OLD_KEY'], os.environ['NEW_KEY'])
path.write_text(text, encoding='utf-8')
PY
          done
          rm -f .github/workflows/switch-supabase-once.yml
          if git diff --quiet; then
            echo "No file changes were needed."
            exit 0
          fi
          git config user.name "codex-automation"
          git config user.email "codex-automation@users.noreply.github.com"
          git add index.html supabase/app.html .github/workflows/switch-supabase-once.yml
          git commit -m "Switch Supabase project in main app"
          git push
