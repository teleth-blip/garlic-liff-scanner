<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>にんにく冷蔵庫管理へ移動します</title>
  <style>
    body{margin:0;padding:24px;background:#f3f6f4;color:#17211b;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{max-width:520px;margin:40px auto;padding:22px;border:1px solid #d8e0da;border-radius:10px;background:#fff}
    h1{margin:0 0 12px;font-size:22px}p{line-height:1.7}
    a{display:inline-block;min-height:44px;padding:12px 16px;border-radius:8px;background:#176b55;color:#fff;font-weight:800;text-decoration:none}
  </style>
  <script>
    (function () {
      var basePath = '/garlic-liff-scanner/';
      var relativePath = location.pathname.indexOf(basePath) === 0
        ? location.pathname.slice(basePath.length)
        : '';
      var target = new URL(relativePath, 'https://eight-corp.github.io/garlic-liff-scanner/');
      target.search = location.search;
      target.hash = location.hash;
      window.redirectTarget = target.toString();
      location.replace(window.redirectTarget);
    })();
  </script>
</head>
<body>
  <main>
    <h1>新しい管理画面へ移動します</h1>
    <p>自動的に切り替わらない場合は、下のボタンを押してください。</p>
    <a id="continueLink" href="https://eight-corp.github.io/garlic-liff-scanner/">にんにく冷蔵庫管理を開く</a>
  </main>
  <script>
    document.getElementById('continueLink').href = window.redirectTarget ||
      'https://eight-corp.github.io/garlic-liff-scanner/';
  </script>
</body>
</html>
